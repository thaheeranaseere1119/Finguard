name: ci
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: finguard, POSTGRES_PASSWORD: finguard_dev_only, POSTGRES_DB: finguard_test }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U finguard" --health-interval 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://finguard:finguard_dev_only@localhost:5432/finguard_test
      TESSDATA_PREFIX: /usr/share/tesseract-ocr/5/tessdata
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-eng fonts-dejavu-core
      - run: pip install -r backend/requirements-dev.txt
      - run: cd backend && pytest --cov=finguard --cov-report=term-missing
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: cd frontend && npm ci && npx tsc -b && npm run build
